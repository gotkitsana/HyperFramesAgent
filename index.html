<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      body {
        font-family: "Inter", sans-serif;
        color: #f5f5f7;
      }

      /* --- layout primitives --- */
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* Scene 1 — kicker + title */
      #kicker {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #8b8b9a;
        margin-bottom: 28px;
      }
      #title {
        font-size: 200px;
        font-weight: 900;
        line-height: 0.95;
        background: linear-gradient(120deg, #fff 0%, #7aa2ff 60%, #b388ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Scene 2 — count-up stat */
      #stat {
        font-size: 320px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        color: #7aa2ff;
      }
      #stat-label {
        font-size: 34px;
        font-weight: 300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8b8b9a;
        margin-top: 12px;
      }

      /* Scene 3 — outro */
      #outro {
        font-size: 120px;
        font-weight: 800;
      }
      #outro small {
        display: block;
        font-size: 30px;
        font-weight: 300;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #8b8b9a;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <!--
      Example composition: a 10s, three-scene title card.
      Demonstrates the "Rule of Three": the root declares the composition,
      every timed element is class="clip" with data-start/duration/track-index,
      and the GSAP timeline is paused + registered on window.__timelines.
      Edit freely — run `npm run check` after every change.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: 0-4s -->
      <div id="scene-1" class="clip center" data-start="0" data-duration="4" data-track-index="0">
        <div id="kicker">Built for agents</div>
        <div id="title">HyperFrames</div>
      </div>

      <!-- Scene 2: 4-7s -->
      <div id="scene-2" class="clip center" data-start="4" data-duration="3" data-track-index="0">
        <div id="stat">0</div>
        <div id="stat-label">frames, fully deterministic</div>
      </div>

      <!-- Scene 3: 7-10s -->
      <div id="scene-3" class="clip center" data-start="7" data-duration="3" data-track-index="0">
        <div id="outro">
          Write HTML. Render video.
          <small>npm run render</small>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1 - kicker + gradient title entrance (varied eases)
      tl.from("#kicker", { autoAlpha: 0, y: 20, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from("#title", { autoAlpha: 0, y: 60, scale: 0.92, duration: 0.9, ease: "expo.out" }, 0.4);
      // subtle mid-scene drift so the scene is never a static slide
      tl.to("#title", { y: -10, duration: 2.2, ease: "sine.inOut" }, 1.4);

      // Scene 2 - deterministic count-up to 60 driven by the timeline (no setInterval)
      const counter = { v: 0 };
      tl.set("#scene-2", { autoAlpha: 0 }, 0);
      tl.to("#scene-2", { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 4);
      tl.to(
        counter,
        {
          v: 60,
          duration: 1.8,
          ease: "power2.out",
          onUpdate: () => {
            document.querySelector("#stat").textContent = Math.round(counter.v);
          },
        },
        4.2
      );
      tl.from("#stat-label", { autoAlpha: 0, y: 16, duration: 0.5 }, 4.6);
      tl.to("#scene-2", { autoAlpha: 0, duration: 0.3 }, 6.8);

      // Scene 3 - outro
      tl.set("#scene-3", { autoAlpha: 0 }, 0);
      tl.to("#scene-3", { autoAlpha: 1, duration: 0.4 }, 7);
      tl.from("#outro", { autoAlpha: 0, y: 40, duration: 0.8, ease: "power3.out" }, 7.1);
      tl.from("#outro small", { autoAlpha: 0, letterSpacing: "0.6em", duration: 0.9, ease: "power2.out" }, 7.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
